<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090509">

<title>Pri's Response ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="module">
    import { SUPABASE_ANON_KEY } from "./p.js";

    const supabaseUrl =
        "https://mzvlybnvgpemdayoylfk.supabase.co";

    window.supabase =
        supabase.createClient(
            supabaseUrl,
            SUPABASE_ANON_KEY
        );

    window.dispatchEvent(
        new Event("supabase-ready")
    );
</script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:Georgia,"Times New Roman",serif;
    color:white;
    background:
        radial-gradient(circle at 50% 30%,rgba(220,50,110,.12),transparent 35%),
        linear-gradient(145deg,#060407,#170a13,#080509);
}

.card{
    width:min(600px,100%);
    padding:50px 30px;
    text-align:center;
    border-radius:30px;
    background:rgba(25,10,20,.78);
    border:1px solid rgba(255,170,200,.2);
    box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.05);
    animation:appear .8s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(25px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.icon{
    font-size:65px;
    margin-bottom:22px;
}

h1{
    font-size:clamp(35px,8vw,58px);
    font-weight:normal;
    color:#ffd0df;
    margin-bottom:20px;
}

.message{
    color:#d8c8d0;
    line-height:1.9;
    font-size:17px;
}

.date{
    margin:28px auto;
    padding:20px;
    border-radius:20px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,180,210,.12);
    color:#f1bfce;
    font-size:20px;
}

.status{
    margin-top:25px;
    color:#a7959f;
    font-size:12px;
    letter-spacing:1px;
}

.refresh{
    margin-top:30px;
    padding:13px 25px;
    border-radius:50px;
    border:1px solid rgba(255,180,210,.2);
    color:white;
    background:rgba(255,255,255,.06);
    font-family:inherit;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

    <div class="icon" id="icon">
        ⏳
    </div>

    <h1 id="title">
        Checking...
    </h1>

    <div class="message" id="message">
        Let me see what Pri decided. ❤️
    </div>

    <div class="date" id="dateBox" style="display:none;">
        Tuesday, 22 September 2026<br>
        4:00 PM — 7:00 PM
    </div>

    <div class="status" id="status">
        Connecting...
    </div>

    <button class="refresh" onclick="loadResponse()">
        Check again
    </button>

</div>


<script>

window.addEventListener(
    "supabase-ready",
    loadResponse
);


async function loadResponse(){

    document.getElementById("status")
        .textContent = "Checking Supabase...";

    try{

        const { data, error } =
            await window.supabase
                .from("pri")
                .select("answer, answered_at")
                .eq("id","pri")
                .single();

        if(error){

            console.error(error);

            document.getElementById("icon")
                .textContent = "⚠️";

            document.getElementById("title")
                .textContent = "Couldn't check.";

            document.getElementById("message")
                .textContent =
                "There was a problem connecting to the response database.";

            document.getElementById("status")
                .textContent = "Connection error.";

            return;
        }


        if(!data.answer){

            document.getElementById("icon")
                .textContent = "💌";

            document.getElementById("title")
                .textContent =
                "Waiting for Pri's answer.";

            document.getElementById("message")
                .innerHTML =
                `The invitation has been sent,
                but Pri hasn't submitted an answer yet. ❤️`;

            document.getElementById("dateBox")
                .style.display = "none";

            document.getElementById("status")
                .textContent =
                "No answer recorded yet.";

            return;
        }


        if(data.answer === "YES"){

            document.getElementById("icon")
                .textContent = "❤️";

            document.getElementById("title")
                .textContent =
                "PRI SAID YES";

            document.getElementById("message")
                .innerHTML =
                `The birthday invitation has been accepted. ❤️<br><br>
                Pri has agreed to spend some time together
                on her birthday.`;

            document.getElementById("dateBox")
                .style.display = "block";

            document.getElementById("status")
                .textContent =
                "Current answer: YES ❤️";

        }


        if(data.answer === "NO"){

            document.getElementById("icon")
                .textContent = "🌷";

            document.getElementById("title")
                .textContent =
                "PRI SAID NO";

            document.getElementById("message")
                .innerHTML =
                `Pri has currently declined the invitation.<br><br>
                Her answer remains changeable from
                the invitation page.`;

            document.getElementById("dateBox")
                .style.display = "none";

            document.getElementById("status")
                .textContent =
                "Current answer: NO";

        }


        if(data.answered_at){

            const date =
                new Date(data.answered_at);

            document.getElementById("status")
                .textContent +=
                " • Updated " +
                date.toLocaleString();
        }


    }catch(error){

        console.error(error);

        document.getElementById("status")
            .textContent =
            "Something went wrong.";
    }

}

</script>

</body>
</html>
